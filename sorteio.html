<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Resultado do Sorteio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #28a745, #218838);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
    }

    .ok {
      background: #d4edda;
      color: #155724;
    }

    .erro {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>🎉 Resultado do Sorteio</h2>

    <input id="numero" placeholder="Digite o número sorteado (ex: 455)">

    <button onclick="buscar()">
      🎰 Iniciar Sorteio
    </button>

    <div id="resultado" class="resultado" style="display:none;"></div>
  </div>

  <script>
    const API = "https://rifa-baxs.onrender.com";

    let animacao;

    async function buscar() {

      const box = document.getElementById("resultado");

      box.style.display = "block";
      box.className = "resultado ok";

      // animação dos números
      let numeroFake = 0;

      animacao = setInterval(() => {
        numeroFake = Math.floor(Math.random() * 1000) + 1;

        box.innerHTML = `
        🎰 Sorteando...<br><br>
        <h1 style="font-size:60px; margin:0;">
          ${numeroFake}
        </h1>
      `;
      }, 80);

      // espera 5 segundos
      setTimeout(async () => {

        try {

          // SUA API deve sortear automaticamente
          const res = await fetch(`${API}/sortear`);
          const data = await res.json();

          clearInterval(animacao);

          if (!res.ok) {
            box.className = "resultado erro";
            box.innerHTML = "❌ Nenhum número disponível";
            return;
          }

          box.className = "resultado ok";

          box.innerHTML = `
          🎉 <strong>GANHADOR!</strong><br><br>

          <h1 style="font-size:70px; color:#28a745; margin:10px 0;">
            ${data.numero}
          </h1>

          <b>Nome:</b> ${data.nome}<br>
          <b>Email:</b> ${data.email}<br>
          <b>Telefone:</b> ${data.telefone}
        `;

        } catch (err) {

          clearInterval(animacao);

          box.className = "resultado erro";
          box.innerHTML = "Erro ao realizar sorteio";
        }

      }, 5000);
    }
  </script>

</body>

</html>
