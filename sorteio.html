<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sorteio</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #28a745, #1e7e34);
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: white;
      width: 400px;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    .numero {
      font-size: 90px;
      font-weight: bold;
      color: #28a745;
      margin: 20px 0;
      transition: .2s;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #28a745;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #218838;
    }

    .info {
      margin-top: 25px;
      text-align: left;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      display: none;
    }

    .loading {
      animation: pulse .1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎰 Sorteio</h1>

    <div id="numero" class="numero">
      ---
    </div>

    <button onclick="sortear()" id="btn">
      INICIAR SORTEIO
    </button>

    <div id="info" class="info"></div>

  </div>

  <script>

    const API = "https://rifa-baxs.onrender.com";

    let intervalo;

    async function sortear() {

      const numeroEl = document.getElementById("numero");
      const info = document.getElementById("info");
      const btn = document.getElementById("btn");

      info.style.display = "none";

      btn.disabled = true;
      btn.innerText = "SORTEANDO...";

      numeroEl.classList.add("loading");

      // números rodando
      intervalo = setInterval(() => {

        const fake =
          Math.floor(Math.random() * 1000) + 1;

        numeroEl.innerText = fake;

      }, 70);

      // espera 5 segundos
      setTimeout(async () => {

        try {

          const res =
            await fetch(`${API}/sortear`);

          const data =
            await res.json();

          clearInterval(intervalo);

          numeroEl.classList.remove("loading");

          if (!res.ok) {

            numeroEl.innerText = "❌";

            info.style.display = "block";
            info.innerHTML =
              "Nenhum participante encontrado";

            btn.disabled = false;
            btn.innerText = "INICIAR SORTEIO";

            return;
          }

          // número vencedor
          numeroEl.innerText = data.numero;

          // dados
          info.style.display = "block";

          info.innerHTML = `
            <h3>🎉 GANHADOR</h3>

            <b>Nome:</b> ${data.nome}<br><br>

            <b>Email:</b> ${data.email}<br><br>

            <b>Telefone:</b> ${data.telefone}
          `;

          btn.disabled = false;
          btn.innerText = "SORTEAR NOVAMENTE";

        } catch (err) {

          clearInterval(intervalo);

          numeroEl.classList.remove("loading");

          numeroEl.innerText = "ERRO";

          info.style.display = "block";
          info.innerHTML = "Erro ao realizar sorteio";

          btn.disabled = false;
          btn.innerText = "TENTAR NOVAMENTE";
        }

      }, 5000);
    }

  </script>

</body>
</html>
